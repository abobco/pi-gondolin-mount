# Additional Gondolin VM mounts.
# Each entry is a string in the format:
#   host_path:guest_path       (read-write)
#   host_path:guest_path:ro    (read-only)
#   host_path:guest_path:rw    (read-write, explicit)
#
# Example:
# mounts:
#   - /home/user/data:/mnt/data
#   - /home/user/readonly:/mnt/readonly:ro

mounts: []

# Optional: path to a custom Gondolin image asset directory produced by
# `gondolin build --output <dir>` (contains manifest.json, kernel, rootfs.ext4).
# Relative paths resolve against this project directory. When unset, falls back
# to the GONDOLIN_GUEST_DIR env var, then to Gondolin's default image.
#
# Example (use the Rust-enabled image built from rust-image-config.json):
# image: ./rust-assets
